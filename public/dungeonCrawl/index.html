<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Crawl</title>
  <style>
    html, body { margin: 0; height: 100%; background: #08060f; overflow: hidden; }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #08060f; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #a8a8cc; font: 16px Georgia, serif; gap: 12px; pointer-events: none; }
    #bar { width: min(280px, 70vw); height: 8px; border: 1px solid #4444aa; border-radius: 4px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #8888cc; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0"></canvas>
  <div id="loading"><div>Opening the guild hall...</div><div id="bar"><div id="fill"></div></div></div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    var canvas = document.getElementById('unity-canvas');
    createUnityInstance(canvas, {
      dataUrl: 'Build/WebGL.data.unityweb',
      frameworkUrl: 'Build/WebGL.framework.js.unityweb',
      codeUrl: 'Build/WebGL.wasm.unityweb',
      companyName: "Deej Potter",
      productName: "Dungeon Crawl",
      productVersion: "1.0.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, function (progress) {
      document.getElementById('fill').style.width = (progress * 100) + '%';
    }).then(function () {
      document.getElementById('loading').remove();
      canvas.focus();
    }).catch(function (message) {
      document.getElementById('loading').textContent = 'The game could not start: ' + message;
    });
  </script>
</body>
</html>
